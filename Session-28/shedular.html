<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="display()">Set Interval</button>
    <button onclick="stopp()"> Clear Interval</button>
    <script>
        let intervalId;
        let counter=0;
        function display(){
            intervalId = setInterval(()=>{
                counter=counter+1;
                console.log(counter);
            }
        ,2000);
        }
           function stopp(){
            clearInterval(intervalId);
            console.log("Counter stopped");
           } 
    </script>
</body>
</html>
